<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrusel de logos</title>
  <link rel="stylesheet" href="./logo-carousel.css">
  <style>
    html,
    body.logo-carousel-demo,
    .logo-carousel,
    .logo-carousel__viewport {
      background: transparent !important;
      background-color: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
  </style>
  <script src="./logo-carousel.js" defer></script>
</head>
<body class="logo-carousel-demo">
  <section class="logo-carousel" data-logo-carousel data-speed="18" aria-label="Marcas">
    <div class="logo-carousel__viewport">
      <div class="logo-carousel__track">
        <ul class="logo-carousel__logos" role="list">
          <li class="logo-carousel__item">
            <span class="logo-carousel__mark logo-carousel__mark--crop logo-carousel__mark--eralum">
              <img src="./assets/eralum.png" alt="Eralum" width="500" height="500" draggable="false">
            </span>
          </li>
          <li class="logo-carousel__item">
            <span class="logo-carousel__mark logo-carousel__mark--crop logo-carousel__mark--estrella">
              <img src="./assets/estrella.jpeg" alt="Estrella" width="2048" height="682" draggable="false">
            </span>
          </li>
          <li class="logo-carousel__item">
            <span class="logo-carousel__mark logo-carousel__mark--square logo-carousel__mark--crop logo-carousel__mark--de-la-rosa">
              <img src="./assets/dulces-de-la-rosa.png" alt="Dulces de la Rosa" width="500" height="500" draggable="false">
            </span>
          </li>
          <li class="logo-carousel__item">
            <span class="logo-carousel__mark logo-carousel__mark--square">
              <img src="./assets/mascota.jpeg" alt="Mascota amarilla sobre fondo rojo" width="447" height="447" draggable="false">
            </span>
          </li>
          <li class="logo-carousel__item">
            <span class="logo-carousel__mark logo-carousel__mark--crop logo-carousel__mark--kavak">
              <img src="./assets/kavak.jpg" alt="Kavak" width="801" height="801" draggable="false">
            </span>
          </li>
          <li class="logo-carousel__item">
            <span class="logo-carousel__mark logo-carousel__mark--crop logo-carousel__mark--pavisa">
              <img src="./assets/pavisa.jpeg" alt="Pavisa" width="256" height="256" draggable="false">
            </span>
          </li>
        </ul>
      </div>
    </div>
  </section>
</body>
</html>
